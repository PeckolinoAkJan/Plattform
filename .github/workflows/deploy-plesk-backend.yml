name: Deploy Backend to Plesk

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target-Umgebung (staging | production)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Backend-Artifact bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      artifact_name: ${{ steps.pkg.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm run build

      - name: Package backend
        id: pkg
        run: |
          mkdir -p ../.artifacts
          tar -czf ../.artifacts/backend-${{ github.sha }}.tgz \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="*.sqlite" \
            -C .. backend
          echo "artifact=backend-${{ github.sha }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: .artifacts/backend-${{ github.sha }}.tgz
          retention-days: 3

  deploy:
    name: Deploy auf Plesk
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: .artifacts

      - name: Copy package to Plesk
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PLESK_HOST }}
          port: ${{ secrets.PLESK_SSH_PORT || 22 }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          source: .artifacts/backend-${{ github.sha }}.tgz
          target: /tmp/vtc-deploy
          strip_components: 1

      - name: Deploy on Plesk
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PLESK_HOST }}
          port: ${{ secrets.PLESK_SSH_PORT || 22 }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.PLESK_BACKEND_DIR }}"
            APP_USER="${{ secrets.PLESK_APP_USER || secrets.PLESK_USER }}"
            SERVICE_NAME="${{ secrets.PLESK_BACKEND_SERVICE_NAME || 'vtc-backend' }}"
            NODE_ENV="${{ secrets.PLESK_NODE_ENV || 'production' }}"
            PORT="${{ secrets.PLESK_BACKEND_PORT || '3001' }}"
            RELEASE_FILE="/tmp/vtc-deploy/backend-${{ github.sha }}.tgz"
            RELEASE_DIR="/tmp/vtc-backend-release"

            if [ -z "${APP_DIR:-}" ]; then
              echo "PLESK_BACKEND_DIR is required (Pfad zur Server-Deployment-Kopie auf Plesk)."
              exit 1
            fi

            mkdir -p "$APP_DIR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$RELEASE_FILE" -C "$RELEASE_DIR"

            RELEASE_PATH="$APP_DIR/releases/${{ github.sha }}"
            mkdir -p "$APP_DIR/releases" "$APP_DIR/shared/uploads" "$APP_DIR/shared/backups"
            ENV_FILE="$APP_DIR/shared/.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "Persistente Backend-Konfiguration fehlt: $ENV_FILE"
              exit 1
            fi
            rm -rf "$RELEASE_PATH"
            mv "$RELEASE_DIR"/backend "$RELEASE_PATH"
            ln -sfn "$APP_DIR/shared/uploads" "$RELEASE_PATH/uploads"
            ln -sfn "$ENV_FILE" "$RELEASE_PATH/.env"

            cd "$RELEASE_PATH"
            chown -R "$APP_USER":"$APP_USER" .

            corepack pnpm install --frozen-lockfile
            corepack pnpm run build
            corepack pnpm run prisma:generate

            command -v pg_dump >/dev/null 2>&1 || { echo "pg_dump is required before migrations"; exit 1; }
            DATABASE_URL_VALUE="$(sed -n 's/^DATABASE_URL=//p' "$ENV_FILE" | tail -n 1 | tr -d '\r')"
            if [ -z "$DATABASE_URL_VALUE" ]; then
              echo "DATABASE_URL fehlt in $ENV_FILE"
              exit 1
            fi
            BACKUP_FILE="$APP_DIR/shared/backups/pre-deploy-${{ github.sha }}-$(date -u +%Y%m%d%H%M%S).dump"
            pg_dump --format=custom --file="$BACKUP_FILE" "$DATABASE_URL_VALUE"

            corepack pnpm run prisma:migrate:deploy
            corepack pnpm prune --prod

            ln -sfn "$RELEASE_PATH" "$APP_DIR/current-next"
            mv -Tf "$APP_DIR/current-next" "$APP_DIR/current"

            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete "$SERVICE_NAME" >/dev/null 2>&1 || true
              cd "$APP_DIR/current"
              PORT="$PORT" NODE_ENV="$NODE_ENV" \
                pm2 start dist/src/main.js --name "$SERVICE_NAME" --time --restart-delay=3000 --max-restarts=20
              pm2 save
            else
              echo "WARN: pm2 nicht gefunden. Bitte in Plesk die Prozessverwaltung konfigurieren (z. B. eigene startCommand im Node.js-Tooling)."
              exit 1
            fi

            healthy=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error "http://127.0.0.1:$PORT/api/health" >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              echo "Backend health check failed on port $PORT."
              exit 1
            fi

            echo "Backend deployed and started via pm2 as $SERVICE_NAME on port $PORT"
            find "$APP_DIR/shared/backups" -mindepth 1 -maxdepth 1 -type f -name 'pre-deploy-*.dump' -printf '%T@ %p\n' | sort -nr | tail -n +11 | cut -d' ' -f2- | xargs -r rm -f
            find "$APP_DIR/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
